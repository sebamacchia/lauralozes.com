<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'">
<title>WAMC · Where Are My Clothes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
<style>
  /* Ink Brutalist: black ink on white paper, heavy rules, one typeface, yellow for attention only. */
  :root {
    --white: #ffffff;
    --black: #000000;
    --grey: #767676;
    --mark: #ffe500;
    --error: #e4002b;
    --rule: 3px;
    --pad: 16px;
    --col: 520px; /* phone column; wider screens show the same layout centred */
    --font: 'Archivo', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--white);
    color: var(--black);
    font: 400 15px/1.4 var(--font);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior-y: none;
  }
  body.locked { overflow: hidden; }
  p { margin: 0; }
  [hidden] { display: none !important; }

  .app {
    max-width: var(--col);
    min-height: 100vh;
    min-height: 100dvh;
    margin: 0 auto;
    padding-top: env(safe-area-inset-top);
    padding-bottom: calc(66px + env(safe-area-inset-bottom));
    overflow-x: clip;
  }
  @media (min-width: 527px) {
    .app, .sheet { border-inline: var(--rule) solid var(--black); }
  }
  .strip {
    padding: 16px var(--pad);
    border-bottom: var(--rule) solid var(--black);
  }

  /* ── Type ── */
  h1, h2, .item b {
    margin: 0;
    font-weight: 800;
    font-stretch: 62%;
    line-height: 0.92;
    letter-spacing: -0.01em;
  }
  h1 {
    font-size: clamp(64px, 26vw, 132px);
    line-height: 0.82;
    letter-spacing: -0.02em;
  }
  h2 { font-size: 30px; }
  .quiet { color: var(--grey); font-size: 13px; }
  .error { color: var(--error); font-weight: 600; }

  .masthead { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .masthead p { font-weight: 600; text-align: right; }

  /* ── Controls ── */
  button, input { font: inherit; color: inherit; }
  button {
    border: 2px solid var(--black);
    border-radius: 0;
    background: var(--white);
    min-height: 44px;
    padding: 9px 14px;
    font-weight: 600;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }
  button.primary,
  button:active {
    background: var(--black);
    color: var(--white);
  }
  button[aria-pressed='true'],
  button.primary:active {
    background: var(--mark);
    color: var(--black);
  }
  @media (hover: hover) {
    button:hover { background: var(--black); color: var(--white); }
    button[aria-pressed='true']:hover,
    button.primary:hover { background: var(--mark); color: var(--black); }
  }
  :focus-visible {
    outline: 3px solid var(--mark);
    outline-offset: 2px;
    box-shadow: 0 0 0 2px var(--black);
  }
  input[type='search'],
  input[type='text'],
  input[type='password'] {
    display: block;
    width: 100%;
    min-height: 48px;
    padding: 11px 12px;
    font-size: 16px; /* below 16px iOS zooms the page on focus */
    background: var(--white);
    border: 2px solid var(--black);
    border-radius: 0;
    -webkit-appearance: none;
    appearance: none;
  }
  input::placeholder { color: var(--grey); opacity: 1; }
  input:focus {
    outline: 3px solid var(--mark);
    outline-offset: 2px;
    box-shadow: 0 0 0 2px var(--black);
  }
  label { display: block; margin-bottom: 10px; font-weight: 600; }

  /* ── Garments: a ruled sheet, one cell per garment ── */
  /* every cell draws its right rule; the last column's is pushed off the edge and clipped */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    margin-right: calc(-1 * var(--rule));
  }
  .item {
    display: flex;
    flex-direction: column;
    min-width: 0;
    padding: 0;
    border: 0;
    border-right: var(--rule) solid var(--black);
    border-bottom: var(--rule) solid var(--black);
    background: var(--white);
    color: var(--black);
    text-align: left;
    font-weight: 400;
  }
  .item:active { background: var(--mark); color: var(--black); }
  @media (hover: hover) { .item:hover { background: var(--mark); color: var(--black); } }
  .item img {
    display: block;
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    border-bottom: 1.5px solid var(--black);
  }
  .item div { padding: 10px var(--pad) 14px; overflow-wrap: anywhere; }
  .item span { display: block; margin-bottom: 6px; font-size: 13px; }
  .item b { display: block; font-size: 24px; }

  .empty h2 { margin-bottom: 10px; }

  .add {
    position: fixed;
    left: 50%;
    bottom: 0;
    width: min(100%, var(--col));
    transform: translateX(-50%);
    padding: 20px var(--pad) calc(20px + env(safe-area-inset-bottom));
    border-width: var(--rule) 0 0;
    font-size: 18px;
    text-align: left;
  }

  /* ── Garment sheet ── */
  .sheet {
    position: fixed;
    top: 0;
    bottom: 0;
    left: 50%;
    width: min(100%, var(--col));
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    overscroll-behavior: contain;
    background: var(--white);
    padding-top: env(safe-area-inset-top);
  }
  .sheet form { flex: 1 0 auto; display: flex; flex-direction: column; }
  .sheet-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .sheet img {
    display: block;
    width: 132px;
    height: 132px;
    object-fit: cover;
    border: 2px solid var(--black);
  }
  .gate h2 { margin-bottom: 10px; }
  .gate #repeatWrap, .gate .error { margin-top: 16px; }
  button:disabled { border-color: var(--grey); color: var(--grey); cursor: default; }
  button.primary:disabled { background: var(--grey); color: var(--white); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips:not(:empty) { margin-bottom: 10px; }
  .actions {
    position: sticky;
    bottom: 0;
    display: flex;
    gap: 2px;
    margin-top: auto;
    background: var(--black);
    border-top: var(--rule) solid var(--black);
  }
  .actions button {
    flex: 1;
    border: 0;
    padding: 20px 10px calc(20px + env(safe-area-inset-bottom));
    font-size: 18px;
  }
  .actions .danger { flex: 0 0 auto; padding-inline: 18px; color: var(--error); }
  .actions .danger:active { background: var(--error); color: var(--white); }
  @media (hover: hover) { .actions .danger:hover { background: var(--error); color: var(--white); } }
</style>
</head>
<body>
<main class="app">
  <header class="strip masthead">
    <h1>WAMC</h1>
    <p>Where are<br>my clothes<br><span id="count" class="quiet"></span></p>
  </header>

  <div id="searchStrip" class="strip" hidden>
    <input id="search" type="search" placeholder="Buscar prenda o lugar" aria-label="Buscar prenda o lugar" autocomplete="off" enterkeyhint="search">
  </div>
  <div id="grid" class="grid"></div>
  <div id="empty" class="strip empty" hidden>
    <h2 id="emptyTitle"></h2>
    <p id="emptyText"></p>
  </div>
  <div id="logoutStrip" class="strip" hidden>
    <button id="logout" type="button">Cerrar sesión</button>
  </div>
</main>

<button id="add" class="add primary" type="button" hidden>Añadir prenda</button>
<input id="camera" type="file" accept="image/*" capture="environment" hidden>

<section id="sheet" class="sheet" hidden>
  <form id="form" autocomplete="off">
    <div class="strip sheet-head">
      <h2 id="sheetTitle"></h2>
      <img id="preview" alt="Foto de la prenda">
    </div>

    <div class="strip">
      <label for="type">Tipo de prenda</label>
      <div id="typeChips" class="chips"></div>
      <input id="type" type="text" placeholder="Camiseta, pantalón" maxlength="40" autocapitalize="sentences" enterkeyhint="next" required>
    </div>

    <div class="strip">
      <label for="place">Dónde está</label>
      <div id="placeChips" class="chips"></div>
      <input id="place" type="text" placeholder="Armario, cajón 2, maleta" maxlength="60" autocapitalize="sentences" enterkeyhint="done" required>
    </div>

    <p id="formError" class="strip error" role="alert" hidden></p>

    <div class="actions">
      <button id="del" class="danger" type="button" hidden>Borrar</button>
      <button id="cancel" type="button">Cancelar</button>
      <button id="save" class="primary" type="submit">Guardar</button>
    </div>
  </form>
</section>

<section id="gate" class="sheet gate" hidden>
  <form id="gateForm">
    <header class="strip masthead">
      <h1>WAMC</h1>
      <p>Where are<br>my clothes</p>
    </header>
    <div class="strip">
      <h2 id="gateTitle"></h2>
      <p id="gateText"></p>
    </div>
    <div class="strip">
      <label for="password">Contraseña</label>
      <input id="password" type="password" minlength="8" maxlength="200" autocomplete="current-password" required>
      <div id="repeatWrap" hidden>
        <label for="password2">Repite la contraseña</label>
        <input id="password2" type="password" maxlength="200" autocomplete="new-password">
      </div>
      <p id="gateError" class="error" role="alert" hidden></p>
    </div>
    <div class="actions">
      <button id="enter" class="primary" type="submit">Entrar</button>
    </div>
  </form>
</section>

<script>
(() => {
  const TYPES = ['Camiseta', 'Camisa', 'Jersey', 'Pantalón', 'Falda', 'Vestido', 'Chaqueta', 'Abrigo', 'Zapatos', 'Accesorio'];
  const MAX_SIDE = 1000;

  const $ = (id) => document.getElementById(id);
  const grid = $('grid'), empty = $('empty'), search = $('search'), sheet = $('sheet'), gate = $('gate');
  const typeInput = $('type'), placeInput = $('place'), preview = $('preview');

  let items = [];
  let editing = null; // { id?, type?, place?, blob? }
  let gateMode = 'login';

  // --- server (photos and list live on the hosting, nothing is kept on the phone) ---
  async function api(action, body) {
    const options = { headers: { 'X-WAMC': '1' }, credentials: 'same-origin' };
    if (body instanceof FormData) {
      Object.assign(options, { method: 'POST', body });
    } else if (body) {
      Object.assign(options, { method: 'POST', body: JSON.stringify(body) });
      options.headers['Content-Type'] = 'application/json';
    }
    let res;
    try {
      res = await fetch('api.php?a=' + action, options);
    } catch (err) {
      throw new Error('Sin conexión. Comprueba internet y vuelve a intentarlo.');
    }
    const data = await res.json().catch(() => ({}));
    if (res.status === 401 && action !== 'login') showGate('login');
    if (!res.ok) throw new Error(data.error || 'El servidor ha fallado. Vuelve a intentarlo.');
    return data;
  }

  const photoUrl = (item) => 'api.php?a=photo&f=' + item.photo;

  async function load() {
    items = (await api('list')).items.reverse(); // the server keeps them oldest first
    render();
  }

  // --- photo ---
  function loadImage(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('No se ha podido leer la foto. Prueba a hacerla otra vez.')); };
      img.src = url;
    });
  }

  async function shrink(file) {
    const img = await loadImage(file);
    const scale = Math.min(1, MAX_SIDE / Math.max(img.width, img.height));
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(img.width * scale);
    canvas.height = Math.round(img.height * scale);
    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
    return new Promise((resolve, reject) => {
      canvas.toBlob((blob) => blob ? resolve(blob) : reject(new Error('No se ha podido preparar la foto.')), 'image/jpeg', 0.8);
    });
  }

  // --- ui ---
  function say(el, message) {
    el.textContent = message || '';
    el.hidden = !message;
  }

  function chips(container, values, input) {
    container.replaceChildren(...values.map((value) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip';
      b.textContent = value;
      b.onclick = () => { input.value = value; mark(container, input); };
      return b;
    }));
    mark(container, input);
  }

  function mark(container, input) {
    const current = input.value.trim().toLowerCase();
    for (const chip of container.children) {
      chip.setAttribute('aria-pressed', String(chip.textContent.toLowerCase() === current));
    }
  }

  // Values already used for a field, newest first, then any starter suggestions not yet used.
  function suggestions(field, starters = []) {
    const seen = new Map();
    for (const value of [...items.map((it) => it[field]), ...starters]) {
      const key = value.toLowerCase();
      if (!seen.has(key)) seen.set(key, value);
    }
    return [...seen.values()].slice(0, 16);
  }

  function openSheet(entry) {
    editing = entry;
    preview.src = entry.blob ? URL.createObjectURL(entry.blob) : photoUrl(entry);
    typeInput.value = entry.type || '';
    placeInput.value = entry.place || '';
    chips($('typeChips'), suggestions('type', TYPES), typeInput);
    chips($('placeChips'), suggestions('place'), placeInput);
    $('del').hidden = entry.id == null;
    $('sheetTitle').textContent = entry.id == null ? 'Nueva prenda' : 'Editar prenda';
    say($('formError'), '');
    busy(false);
    sheet.hidden = false;
    document.body.classList.add('locked');
    sheet.scrollTop = 0;
  }

  function closeSheet() {
    sheet.hidden = true;
    document.body.classList.remove('locked');
    if (preview.src.startsWith('blob:')) URL.revokeObjectURL(preview.src);
    preview.removeAttribute('src');
    editing = null;
  }

  function busy(on) {
    for (const button of sheet.querySelectorAll('button')) button.disabled = on;
    $('save').textContent = on ? 'Guardando' : 'Guardar';
  }

  function showGate(mode) {
    gateMode = mode;
    const setup = mode === 'setup';
    $('gateTitle').textContent = setup ? 'Crea la contraseña.' : 'Escribe la contraseña.';
    $('gateText').textContent = setup
      ? 'Protege tu armario. Solo quien la sepa podrá ver, añadir o borrar prendas. Mínimo 8 caracteres.'
      : 'Este teléfono la recordará durante 3 meses.';
    $('repeatWrap').hidden = !setup;
    $('password').autocomplete = setup ? 'new-password' : 'current-password';
    $('password2').required = setup;
    $('enter').textContent = setup ? 'Crear contraseña' : 'Entrar';
    $('password').value = $('password2').value = '';
    say($('gateError'), '');
    if (!sheet.hidden) closeSheet();
    $('add').hidden = true;
    gate.hidden = false;
    document.body.classList.add('locked');
  }

  async function enter() {
    gate.hidden = true;
    document.body.classList.remove('locked');
    $('add').hidden = false;
    $('logoutStrip').hidden = false;
    try {
      await load();
    } catch (err) {
      if (gate.hidden) problem(err.message);
    }
  }

  function problem(message) {
    grid.replaceChildren();
    $('searchStrip').hidden = true;
    empty.hidden = false;
    $('emptyTitle').textContent = 'No se ha podido cargar.';
    $('emptyText').textContent = message;
  }

  function render() {
    const q = search.value.trim().toLowerCase();
    const shown = q
      ? items.filter((it) => (it.type + ' ' + it.place).toLowerCase().includes(q))
      : items;

    grid.replaceChildren(...shown.map((it) => {
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'item';
      const img = document.createElement('img');
      img.src = photoUrl(it);
      img.alt = it.type;
      img.loading = 'lazy';
      const info = document.createElement('div');
      const type = document.createElement('span');
      type.textContent = it.type;
      const place = document.createElement('b');
      place.textContent = it.place;
      info.append(type, place);
      card.append(img, info);
      card.onclick = () => openSheet({ ...it });
      return card;
    }));

    $('searchStrip').hidden = items.length === 0;
    $('count').textContent = items.length === 1 ? '1 prenda' : items.length ? items.length + ' prendas' : '';
    empty.hidden = shown.length > 0;
    $('emptyTitle').textContent = items.length ? 'Nada coincide.' : 'Fotografía tu primera prenda.';
    $('emptyText').textContent = items.length
      ? 'Prueba con otro tipo de prenda o con otro lugar.'
      : 'Después apunta qué es y dónde la guardas.';
  }

  // --- events ---
  $('add').onclick = () => $('camera').click();

  $('camera').onchange = async (e) => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    try {
      openSheet({ blob: await shrink(file) });
    } catch (err) {
      problem(err.message);
    }
  };

  typeInput.oninput = () => mark($('typeChips'), typeInput);
  typeInput.onkeydown = (e) => {
    if (e.key === 'Enter') { e.preventDefault(); placeInput.focus(); }
  };
  placeInput.oninput = () => mark($('placeChips'), placeInput);
  search.oninput = render;
  $('cancel').onclick = closeSheet;

  $('form').onsubmit = async (e) => {
    e.preventDefault();
    const type = typeInput.value.trim();
    const place = placeInput.value.trim();
    if (!type || !place || !editing) return;
    const body = new FormData();
    body.set('type', type);
    body.set('place', place);
    if (editing.id != null) body.set('id', editing.id);
    else body.set('photo', editing.blob, 'photo.jpg');
    busy(true);
    try {
      await api('save', body);
      closeSheet();
      await load();
    } catch (err) {
      if (!sheet.hidden) { busy(false); say($('formError'), err.message); }
    }
  };

  $('del').onclick = async () => {
    if (!confirm('¿Borrar esta prenda? La foto se elimina del servidor y no se puede recuperar.')) return;
    busy(true);
    try {
      await api('delete', { id: editing.id });
      closeSheet();
      await load();
    } catch (err) {
      if (!sheet.hidden) { busy(false); say($('formError'), err.message); }
    }
  };

  $('gateForm').onsubmit = async (e) => {
    e.preventDefault();
    const password = $('password').value;
    if (gateMode === 'setup' && password !== $('password2').value) {
      say($('gateError'), 'Las dos contraseñas no coinciden.');
      return;
    }
    $('enter').disabled = true;
    try {
      await api(gateMode, { password });
      await enter();
    } catch (err) {
      say($('gateError'), err.message);
    } finally {
      $('enter').disabled = false;
    }
  };

  $('logout').onclick = async () => {
    try {
      await api('logout', {});
    } catch (err) {
      return problem(err.message);
    }
    items = [];
    render();
    $('logoutStrip').hidden = true;
    showGate('login');
  };

  api('state')
    .then((state) => state.auth ? enter() : showGate(state.setup ? 'setup' : 'login'))
    .catch((err) => problem(err.message));
})();
</script>
</body>
</html>
